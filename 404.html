<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found · Deepak Bharadwaj</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0b10;
      --text: #f1f3f9;
      --text-muted: #9ca3af;
      --accent: #14b8a6;
      --accent-glow: rgba(20, 184, 166, 0.2);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    .ambient {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .code {
      font-size: clamp(5rem, 16vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #14b8a6, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      z-index: 1;
    }

    .msg {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      max-width: 420px;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent);
      padding: 0.75rem 1.6rem;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.25s ease;
      position: relative;
      z-index: 1;
    }

    .back:hover {
      background: #0d9488;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="code">404</div>
  <p class="msg">The page you were looking for doesn't exist or has been relocated.</p>
  <a href="index.html" class="back">← Return to Portfolio</a>
</body>
</html>
