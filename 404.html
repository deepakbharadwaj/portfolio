<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found · Deepak Bharadwaj</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FAF7EE;
      --text: #191614;
      --text-muted: #5C554B;
      --border: rgba(26, 22, 18, 0.12);
      --coral: #F28564;
      --coral-hover: #E47553;
      --wine: #4A0E2E;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
      background-image: 
        linear-gradient(to right, rgba(26, 22, 18, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(26, 22, 18, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .badge-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: #D4F4E7;
      color: #125E47;
      padding: 0.35rem 0.95rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      display: inline-block;
    }

    .code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(6rem, 18vw, 11rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 0.5rem;
      color: var(--wine);
    }

    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-style: italic;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .msg {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      max-width: 440px;
      line-height: 1.6;
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      font-weight: 700;
      font-size: 0.96rem;
      color: #191614;
      background: var(--coral);
      padding: 0.45rem 0.55rem 0.45rem 1.4rem;
      border-radius: 9999px;
      border: 1.5px solid #191614;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(242, 133, 100, 0.35);
      transition: all 0.2s ease;
    }

    .btn-return:hover {
      background: var(--coral-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(242, 133, 100, 0.4);
    }

    .btn-icon {
      background: #191614;
      color: #FFFFFF;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <span class="badge-pill">STATUS: 404 NOT FOUND</span>
  <div class="code">404</div>
  <h1 class="title">Lost in Architecture</h1>
  <p class="msg">The page or route you were looking for doesn't exist or has been relocated to another service endpoint.</p>
  <a href="index.html" class="btn-return">
    <span>Return to Portfolio</span>
    <span class="btn-icon">←</span>
  </a>
</body>
</html>
